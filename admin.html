<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#090909"><title>Барбер Сүгүр — Панель управления</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#131313;--line:#292929;--muted:#929292;--red:#e00800;--green:#31c477;--amber:#e6b64c}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;background:var(--bg);color:#f5f5f5;font:15px Inter,Arial,sans-serif;padding:22px;padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));overflow-wrap:anywhere;max-width:1120px;margin:auto}button,input,select{font:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 25px}h1{font-size:27px;margin:0;text-transform:uppercase;letter-spacing:.4px}h1 em{color:var(--red);font-style:normal}.sub{color:var(--muted);font-size:13px;margin-top:5px}.btn{border:0;background:var(--red);color:#fff;padding:12px 16px;font-weight:700;cursor:pointer;border-radius:5px}.btn.dark{background:#252525}.btn.green{background:#176c43}.btn.gray{background:#333}.btn:disabled{opacity:.5}.login{max-width:420px;margin:12vh auto;background:var(--panel);padding:25px;border:1px solid var(--line)}input,select{background:#0c0c0c;color:white;border:1px solid var(--line);padding:13px;border-radius:5px;width:100%;margin:7px 0;font-size:16px;-webkit-appearance:none;appearance:none}.login button{width:100%;margin-top:8px}#e{color:#ff7770;min-height:22px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat,.panel,.booking{background:var(--panel);border:1px solid var(--line);border-radius:8px}.stat{padding:17px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:28px;margin-top:7px}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:15px 0}.tools input,.tools select{width:auto;min-width:160px;margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{background:#222;color:#ddd;border:1px solid #333;padding:12px 13px;min-height:44px;border-radius:5px;cursor:pointer}.tabs button.active{background:var(--red);border-color:var(--red);color:#fff}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.booking{padding:16px;border-left:4px solid var(--amber)}.booking.confirmed{border-left-color:var(--green)}.booking.arrived{border-left-color:#68a9ff}.booking.declined{border-left-color:#555;opacity:.65}.date{font-size:18px;font-weight:800}.service{font-weight:700;margin:10px 0 6px}.meta{color:#bbb;line-height:1.8;font-size:14px}.status{display:inline-block;font-size:12px;padding:5px 8px;border-radius:20px;background:#392f18;color:#f1ca70;margin-top:10px}.confirmed .status{background:#123a29;color:#72e0a9}.arrived .status{background:#172e48;color:#9acaff}.declined .status,.cancelled .status{background:#292929;color:#aaa}.booking.cancelled{border-left-color:#c0392b;opacity:.7}.cancelled .status{background:#3a1816;color:#ff8a80}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:13px;padding:12px 14px;min-height:44px}.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed #333;border-radius:8px}.hidden{display:none!important}a{color:#ddd}@media(max-width:700px){body{padding:14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}header{flex-wrap:wrap}.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}.tabs button{flex:none;white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:22px}.tools input,.tools select{flex:1;min-width:130px}}
</style></head><body>
<section id="login" class="login hidden"><h1>Барбер <em>Сүгүр</em></h1><p class="sub">Панель управления записями</p><form id="f"><input id="u" autocomplete="username" value="zhlmnvsr" autocapitalize="none" aria-label="Логин"><div style="position:relative"><input id="p" type="password" placeholder="Пароль" autocomplete="current-password" required style="padding-right:56px"><button type="button" id="eye" aria-label="Показать пароль" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);width:46px;height:46px;background:none;border:0;color:#929292;cursor:pointer;margin:0;padding:0"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/><path class="sls" style="stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .35s" d="M3 3l18 18" pathLength="1"/></svg></button></div><input id="k" placeholder="Код первоначальной настройки" style="display:none"><button class="btn" id="go">Войти</button><p id="e"></p></form></section>
<main id="app" class="hidden"><header><div><h1>Барбер <em>Сүгүр</em></h1><div class="sub">Управление записями клиентов</div></div><button class="btn dark" id="out">Выйти</button></header>
<div class="stats"><div class="stat"><span>Всего записей</span><b id="sAll">0</b></div><div class="stat"><span>Ожидают подтверждения</span><b id="sWait">0</b></div><div class="stat"><span>Сегодня</span><b id="sToday">0</b></div><div class="stat"><span>Предстоящие (с сегодня)</span><b id="sUp">0</b></div><div class="stat"><span>Клиенты пришли</span><b id="sArrived">0</b></div></div>
<div class="panel" style="padding:14px"><div class="tabs" id="tabs"><button data-tab="all" class="active">Все записи</button><button data-tab="today">Сегодня</button><button data-tab="upcoming">Предстоящие</button><button data-tab="pending">Ожидают</button><button data-tab="confirmed">Подтверждены</button><button data-tab="arrived">Пришли</button><button data-tab="declined">Отклонены</button><button data-tab="cancelled">Отменены клиентом</button></div><div class="tools"><input type="date" id="filterDate" aria-label="Фильтр по дате"><select id="sort"><option value="asc">Сначала ближайшие</option><option value="desc">Сначала поздние</option></select><button class="btn dark" id="clearDate">Сбросить дату</button></div></div>
<div class="tools" style="justify-content:space-between"><span class="sub" id="count">Загрузка...</span><button class="btn dark" id="refresh">↻ Обновить</button></div><div id="list" class="list"></div>
<div class="panel" style="padding:14px;margin-top:22px"><h2 style="margin:0 0 6px;font-size:20px;text-transform:uppercase">Отзывы <span class="sub" id="rvCount"></span></h2><div class="list" id="rvList"></div></div></main>
<script>
const $=s=>document.querySelector(s);let rows=[],tab='all',setup=false,timer=null;
const api=async(url,opts={})=>{const r=await fetch(url,opts);if(!r.ok)throw r.status;return r.status===204?{}:r.json()};
const today=()=>new Date(Date.now()+5*3600000).toISOString().slice(0,10);
async function init(){try{const s=await api('/api/admin/state');if(s.in){openApp();return}setup=!s.setup;$('#login').classList.remove('hidden');$('#k').style.display=setup?'':'none';$('#p').autocomplete=setup?'new-password':'current-password';$('#go').textContent=setup?'Создать пароль':'Войти'}catch(e){$('#login').classList.remove('hidden');$('#e').textContent='Не удалось подключиться к серверу'}}
$('#f').onsubmit=async e=>{e.preventDefault();$('#e').textContent='';try{await api(setup?'/api/admin/setup':'/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#u').value.trim(),password:$('#p').value,code:$('#k').value})});openApp()}catch(x){$('#e').textContent=x===403?'Неверный код настройки':x===401?'Неверный логин или пароль':x===429?'Слишком много попыток. Подождите.':'Ошибка подключения'}};
function openApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load();if(timer)clearInterval(timer);timer=setInterval(load,10000)}
async function load(){loadRv();try{rows=await api('/api/admin/list');render()}catch(e){$('#list').innerHTML='<div class="empty">Не удалось загрузить записи. Проверьте подключение.</div>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const t=today();$('#sAll').textContent=rows.length;$('#sWait').textContent=rows.filter(x=>x.status==='pending').length;const live=x=>x.status!=='declined'&&x.status!=='cancelled';$('#sToday').textContent=rows.filter(x=>x.date===t&&live(x)).length;$('#sUp').textContent=rows.filter(x=>x.date>=t&&live(x)).length;$('#sArrived').textContent=rows.filter(x=>x.status==='arrived').length;
let a=rows.filter(b=>tab==='all'||(tab==='today'?b.date===t&&live(b):tab==='upcoming'?b.date>=t&&live(b):b.status===tab));const d=$('#filterDate').value;if(d)a=a.filter(b=>b.date===d);a.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)*(($('#sort').value==='asc')?1:-1));$('#count').textContent=`Показано записей: ${a.length}`;
$('#list').innerHTML=a.map(b=>{const label={pending:'Ожидает подтверждения',confirmed:'Подтверждена',arrived:'Клиент пришёл',declined:'Отклонена',cancelled:'Клиент отменил запись'}[b.status]||b.status;return `<article class="booking ${esc(b.status)}"><div class="date">${esc(b.date)} · ${esc(b.time)}</div><div class="service">${esc(b.svc)} — ${esc(b.price)} ₸</div><div class="meta">👤 ${esc(b.name)}<br>📞 <a href="tel:+7${esc(b.phone)}">+7 ${esc(b.phone)}</a><br>💬 <a href="https://wa.me/7${esc(b.phone)}" target="_blank" rel="noopener">Написать в WhatsApp</a></div><span class="status">${label}</span><div class="actions">${b.status==='pending'?`<button class="btn green" data-action="confirmed" data-id="${esc(b.id)}">✓ Принять</button>`:''}${b.status==='confirmed'?`<button class="btn green" data-action="arrived" data-id="${esc(b.id)}">✓ Клиент пришёл</button>`:''}${b.status!=='declined'&&b.status!=='arrived'&&b.status!=='cancelled'?`<button class="btn gray" data-action="declined" data-id="${esc(b.id)}">Отклонить</button>`:''}<button class="btn dark" data-delete="${esc(b.id)}">Удалить</button></div></article>`}).join('')||'<div class="empty" style="grid-column:1/-1">Записей не найдено</div>'}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()};$('#filterDate').onchange=render;$('#sort').onchange=render;$('#clearDate').onclick=()=>{$('#filterDate').value='';render()};$('#refresh').onclick=load;
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action){b.disabled=true;try{await api('/api/admin/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.id,status:b.dataset.action})});await load()}catch(x){alert('Не удалось изменить статус')}finally{b.disabled=false}}if(b.dataset.delete){if(!confirm('Удалить эту запись без возможности восстановления?'))return;try{await api('/api/admin/booking/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});await load()}catch(x){alert('Не удалось удалить запись')}}});
$('#out').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}finally{location.reload()}};$('#eye').onclick=()=>{const w=$('#p'),sh=w.type==='password';w.type=sh?'text':'password';$('#eye').style.color=sh?'#e00800':'#929292';$('#eye .sls').style.strokeDashoffset=sh?1:0};
let rvs=[];
async function loadRv(){try{rvs=await api('/api/admin/reviews');renderRv()}catch(e){}}
function renderRv(){const w=rvs.filter(x=>!x.approved).length;$('#rvCount').textContent=w?`· ждут проверки: ${w}`:'';
$('#rvList').innerHTML=rvs.length?rvs.map(v=>`<article class="booking ${v.approved?'confirmed':'pending'}"><div class="date">${'★'.repeat(v.rating)}${'☆'.repeat(5-v.rating)} · ${esc(v.name)}</div><div class="meta">${esc(v.text)}</div><span class="status">${v.approved?'Опубликован':'Ждёт проверки'}</span><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${v.approved?`<button class="btn dark" data-rv="hide" data-id="${esc(v.id)}">Скрыть</button>`:`<button class="btn" data-rv="show" data-id="${esc(v.id)}">Опубликовать</button>`}<button class="btn dark" data-rv="del" data-id="${esc(v.id)}">Удалить</button></div></article>`).join(''):'<div class="empty">Отзывов пока нет</div>'}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-rv]');if(!b)return;b.disabled=true;try{
if(b.dataset.rv==='del'){if(!confirm('Удалить отзыв?'))return;await api('/api/admin/review/'+encodeURIComponent(b.dataset.id),{method:'DELETE'})}
else await api('/api/admin/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.id,approved:b.dataset.rv==='show'})});await loadRv()}catch(x){alert('Не удалось выполнить действие')}finally{b.disabled=false}});
init();
</script></body></html>
